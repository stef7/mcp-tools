name: ci
# One workflow from pull request to production, so every step shows on the PR and in the Actions tab.
#
#   pull request   check, and upload each changed worker as a version that Cloudflare accepts but
#                  does not serve: proof that the deploy would succeed, with no traffic touched.
#   push to main   check, then deploy each changed worker (all of them when core/ changed).
#   run by hand    check, then deploy every worker.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a PR makes the older run moot. A deploy is never cut off halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test

  # Cloudflare rejects some things only on upload (a setting the plan refuses, a binding that does
  # not resolve, a missing required secret), and no local test can see those.
  upload:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Upload each changed worker as a version, without deploying it
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::No CLOUDFLARE_API_TOKEN for this run (a fork or a bot's PR), so nothing was uploaded."
            exit 0
          fi
          # Assigned first, so that a failure to work out the list fails the step.
          dirs=$(scripts/changed-workers.sh "${{ github.event.pull_request.base.sha }}")
          failed=""
          for d in $dirs; do
            echo "::group::$d"
            name=$(node -p "require('./$d/wrangler.json').name")
            # A worker's very first upload has to be a deploy, so a new one is only compiled here.
            # Anything but "found" or "not found" (a token without access, say) is a failure.
            status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$name/settings")
            case "$status" in
              200) (cd "$d" && npx wrangler versions upload --message "PR #${{ github.event.number }} at ${{ github.event.pull_request.head.sha }}") || failed="$failed $d" ;;
              404) echo "::notice::$name is not on Cloudflare yet, so it is only compiled. Its first deploy will create it."
                   (cd "$d" && npx wrangler deploy --dry-run) || failed="$failed $d" ;;
              *) echo "::error::Looking $name up on Cloudflare answered HTTP $status."; failed="$failed $d" ;;
            esac
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::Cloudflare did not accept:$failed"; exit 1; fi

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    # Shows each deploy under Deployments on the repo's front page.
    environment: production
    concurrency: { group: deploy, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Deploy each changed worker
        run: |
          # `before` is the commit main was at before this push. A run by hand has none, so it
          # deploys everything.
          before="${{ github.event_name == 'push' && github.event.before || '' }}"
          dirs=$(scripts/changed-workers.sh "$before")
          failed=""
          for d in $dirs; do
            echo "::group::$d"
            (cd "$d" && npx wrangler deploy) || failed="$failed $d"
            echo "::endgroup::"
          done
          # One worker failing does not hold back the rest, but it does fail the run.
          if [ -n "$failed" ]; then echo "::error::Deploy failed:$failed"; exit 1; fi
